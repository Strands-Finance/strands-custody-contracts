[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 256 }
gas_reports = ["StrandsCustodyToken"]

[lint]
# OZ ERC20 reverts on failure instead of returning false, so unchecked
# transfer/transferFrom calls in tests are intentional.
exclude_lints = ["erc20-unchecked-transfer"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

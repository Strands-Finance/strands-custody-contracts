name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: forge test -vvv
      - name: forge fmt --check
        run: forge fmt --check
      # `forge build`/`forge test` compile from src/ and never read abi/, so a contract change that
      # skips the README "Regenerating after a contract change" block passes every step above while
      # abi/ still describes the old contract. The consumer generates its Nethereum bindings AND its
      # BYTECODE constant from abi/StrandsDACAP.json, so a stale artifact there deploys an
      # older contract against newer call sites — reverting only on a live call to a selector the
      # deployed code has no dispatch entry for.
      - name: abi/ matches src/
        run: |
          forge inspect StrandsDACAP abi --json > /tmp/fresh.abi
          forge inspect StrandsDACAP bytecode | sed 's/^0x//' > /tmp/fresh.bin
          python3 - <<'PY'
          import json, os, sys

          # Compare parsed, not byte-for-byte: the CI toolchain floats on `stable`, and a forge
          # release that reindents or reorders its JSON must not read as contract drift.
          def norm(x): return json.dumps(x, sort_keys=True)

          fresh_abi = json.load(open("/tmp/fresh.abi"))
          fresh_bin = open("/tmp/fresh.bin").read().strip()
          committed_abi = json.load(open("abi/StrandsDACAP.abi"))
          committed_bin = open("abi/StrandsDACAP.bin").read().strip()
          artifact = json.load(open("abi/StrandsDACAP.json"))

          drift = []
          if norm(fresh_abi) != norm(committed_abi):
              fresh_fns = {f"{e['name']}({','.join(i['type'] for i in e['inputs'])})"
                           for e in fresh_abi if e["type"] == "function"}
              old_fns = {f"{e['name']}({','.join(i['type'] for i in e['inputs'])})"
                         for e in committed_abi if e["type"] == "function"}
              drift.append("abi/StrandsDACAP.abi is stale")
              for fn in sorted(fresh_fns - old_fns): drift.append(f"    missing from abi/: {fn}")
              for fn in sorted(old_fns - fresh_fns): drift.append(f"    no longer in src/: {fn}")
          if fresh_bin != committed_bin:
              drift.append("abi/StrandsDACAP.bin is stale")
          # The artifact is the file the consumer generates from, so its two halves are checked
          # against src/ independently — a spliced abi/bin pair is exactly how they drift apart.
          if norm(artifact["abi"]) != norm(fresh_abi):
              drift.append("abi/StrandsDACAP.json carries a stale `abi`")
          if artifact["bytecode"].removeprefix("0x") != fresh_bin:
              drift.append("abi/StrandsDACAP.json carries a stale `bytecode`")

          # The standard JSON input is the ONLY artifact nothing else would catch. forge build and
          # forge test never read it, the bytecode check above cannot see it, and a block explorer
          # answers every submission with "verification started" and reports nothing at all when the
          # sources compile but do not match — so drift here is invisible until someone opens the
          # contract page and finds raw bytecode. Compare the source text it carries against src/.
          standard_input = json.load(open("abi/StrandsDACAP.standard-input.json"))
          submitted = standard_input["input"]["sources"]
          if artifact["sourceName"] not in submitted:
              drift.append(f"abi/StrandsDACAP.standard-input.json has no entry for "
                           f"{artifact['sourceName']} — it predates the contract's current name")
          # Every FIRST-PARTY source, not just the entrypoint: an edit to src/interfaces/ lands in the
          # bytecode and in this payload, and checking only the main file would miss it.
          for name, entry in sorted(submitted.items()):
              if not name.startswith("src/"):
                  continue          # lib/ is a pinned submodule; git already guarantees it
              if not os.path.exists(name):
                  drift.append(f"abi/StrandsDACAP.standard-input.json references {name}, "
                               "which no longer exists in src/")
              elif entry["content"] != open(name).read():
                  drift.append(f"abi/StrandsDACAP.standard-input.json carries a stale {name}")

          if drift:
              print("\n".join(drift))
              sys.exit("\nRe-run the 'Regenerating after a contract change' block in README.md, "
                       "then copy abi/StrandsDACAP.json AND abi/StrandsDACAP.standard-input.json "
                       "to the consumer and re-run its generator.")
          print("abi/ is in sync with src/")
          PY
